<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#050505">
    <meta name="description" content="Panda Man 🐼 — just vibing in panda mode.">

    <title>Panda Man 🐼</title>

    <!-- Panda Favicon -->
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐼%3C/text%3E%3C/svg%3E"
    >

    <link
        rel="apple-touch-icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐼%3C/text%3E%3C/svg%3E"
    >

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background: #020303;
            color: #ffffff;

            font-family: "Orbitron", sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           BACKGROUND
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            z-index: -20;

            overflow: hidden;

            background: #020505;
        }

        .background img {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;

            filter:
                brightness(0.58)
                contrast(1.08)
                saturate(0.82);

            transform: scale(1.05);

            animation: slowZoom 18s ease-in-out infinite alternate;
        }

        /* Cinematic darkness */
        .background::before {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.50) 0%,
                    rgba(0, 0, 0, 0.18) 32%,
                    rgba(0, 0, 0, 0.42) 65%,
                    rgba(0, 0, 0, 0.86) 100%
                );

            pointer-events: none;
        }

        /* Vignette */
        .background::after {
            content: "";

            position: absolute;
            inset: 0;

            z-index: 3;

            background:
                radial-gradient(
                    circle at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.30) 58%,
                    rgba(0, 0, 0, 0.78) 100%
                );

            pointer-events: none;
        }

        @keyframes slowZoom {
            from {
                transform: scale(1.05);
            }

            to {
                transform: scale(1.11);
            }
        }


        /* =========================================================
           ATMOSPHERIC GRID
        ========================================================= */

        .grid {
            position: fixed;
            inset: 0;

            z-index: -10;

            pointer-events: none;

            opacity: 0.08;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.08) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.08) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 30%,
                    black 70%,
                    transparent
                );
        }


        /* =========================================================
           GRAIN
        ========================================================= */

        .grain {
            position: fixed;
            inset: -50%;

            z-index: 20;

            pointer-events: none;

            opacity: 0.045;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");

            animation: grainMove 0.25s steps(2) infinite;
        }

        @keyframes grainMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(2%, -2%);
            }

            50% {
                transform: translate(-2%, 2%);
            }

            75% {
                transform: translate(2%, 2%);
            }

            100% {
                transform: translate(-2%, -2%);
            }
        }


        /* =========================================================
           PARTICLES
        ========================================================= */

        .particles {
            position: fixed;
            inset: 0;

            z-index: -5;

            overflow: hidden;

            pointer-events: none;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: rgba(255,255,255,0.65);

            box-shadow:
                0 0 8px rgba(255,255,255,0.45);

            animation:
                floatParticle linear infinite,
                particleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes floatParticle {
            from {
                transform: translateY(110vh) translateX(0);
            }

            to {
                transform: translateY(-15vh) translateX(80px);
            }
        }

        @keyframes particleGlow {
            from {
                opacity: 0.2;
            }

            to {
                opacity: 0.8;
            }
        }


        /* =========================================================
           FLOATING PANDAS
        ========================================================= */

        .floating-pandas {
            position: fixed;
            inset: 0;

            z-index: -2;

            overflow: hidden;

            pointer-events: none;
        }

        .panda {
            position: absolute;

            font-size: clamp(25px, 3vw, 45px);

            opacity: 0.10;

            filter:
                grayscale(1)
                blur(0.3px)
                drop-shadow(0 0 15px rgba(255,255,255,0.15));

            animation:
                pandaFloat 14s ease-in-out infinite;
        }

        .panda:nth-child(1) {
            left: 7%;
            top: 20%;
            animation-delay: -3s;
        }

        .panda:nth-child(2) {
            right: 8%;
            top: 15%;
            animation-delay: -8s;
        }

        .panda:nth-child(3) {
            left: 13%;
            bottom: 12%;
            animation-delay: -5s;
        }

        .panda:nth-child(4) {
            right: 14%;
            bottom: 18%;
            animation-delay: -10s;
        }

        @keyframes pandaFloat {
            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(-4deg);
            }

            50% {
                transform:
                    translate3d(20px, -30px, 0)
                    rotate(4deg);
            }
        }


        /* =========================================================
           MAIN
        ========================================================= */

        main {
            position: relative;

            min-height: 100vh;

            width: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                70px 20px
                calc(70px + env(safe-area-inset-bottom));
        }


        /* =========================================================
           PROFILE CARD
        ========================================================= */

        .card {
            position: relative;

            width: min(520px, 100%);

            padding: 42px 30px 30px;

            border:
                1px solid
                rgba(255,255,255,0.14);

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15,15,15,0.80),
                    rgba(3,3,3,0.68)
                );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.70),
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 0 50px rgba(255,255,255,0.025);

            overflow: hidden;

            animation: cardAppear 1s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* Top shine */
        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 10%;

            width: 80%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.55),
                    transparent
                );

            opacity: 0.65;
        }

        /* Glow */
        .card::after {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            left: 50%;
            top: -170px;

            transform: translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.07),
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================================================
           CORNER DETAILS
        ========================================================= */

        .corner {
            position: absolute;

            width: 24px;
            height: 24px;

            opacity: 0.6;
        }

        .corner::before,
        .corner::after {
            content: "";

            position: absolute;

            background: rgba(255,255,255,0.6);
        }

        .corner::before {
            width: 100%;
            height: 1px;
        }

        .corner::after {
            width: 1px;
            height: 100%;
        }

        .corner-tl {
            top: 15px;
            left: 15px;
        }

        .corner-tr {
            top: 15px;
            right: 15px;
            transform: rotate(90deg);
        }

        .corner-bl {
            bottom: 15px;
            left: 15px;
            transform: rotate(-90deg);
        }

        .corner-br {
            bottom: 15px;
            right: 15px;
            transform: rotate(180deg);
        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status {
            position: relative;

            width: fit-content;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;
            gap: 9px;

            padding: 8px 14px;

            border-radius: 999px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.045);

            color: rgba(255,255,255,0.70);

            font-size: 10px;
            font-weight: 600;

            letter-spacing: 1.8px;

            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #b7ffb7;

            box-shadow:
                0 0 10px rgba(130,255,150,0.8);

            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.85);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }


        /* =========================================================
           PANDA LOGO
        ========================================================= */

        .logo-wrap {
            display: flex;

            justify-content: center;

            margin-bottom: 16px;
        }

        .logo {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 105px;
            height: 105px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    rgba(255,255,255,0.16),
                    rgba(255,255,255,0.025) 48%,
                    rgba(0,0,0,0.25) 100%
                );

            border:
                1px solid
                rgba(255,255,255,0.16);

            box-shadow:
                0 0 40px rgba(255,255,255,0.08),
                inset 0 0 25px rgba(255,255,255,0.035);

            animation: logoFloat 5s ease-in-out infinite;
        }

        .logo::before {
            content: "";

            position: absolute;
            inset: -9px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.07);

            animation: logoRing 7s linear infinite;
        }

        .logo::after {
            content: "";

            position: absolute;

            inset: -20px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.08),
                    transparent 65%
                );

            z-index: -1;
        }

        .logo span {
            font-size: 58px;

            line-height: 1;

            filter:
                drop-shadow(
                    0 0 16px
                    rgba(255,255,255,0.22)
                );
        }

        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        @keyframes logoRing {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           TITLE
        ========================================================= */

        .title {
            text-align: center;

            font-size: clamp(34px, 8vw, 52px);

            font-weight: 900;

            letter-spacing: 5px;

            line-height: 1.1;

            color: #ffffff;

            text-shadow:
                0 0 20px rgba(255,255,255,0.12);

            margin-bottom: 9px;
        }

        .title span {
            display: inline-block;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #bbbbbb 52%,
                    #666666 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            min-height: 20px;

            text-align: center;

            color: rgba(255,255,255,0.48);

            font-size: 11px;

            letter-spacing: 2.8px;

            text-transform: uppercase;

            margin-bottom: 26px;
        }

        .cursor {
            display: inline-block;

            width: 7px;
            height: 12px;

            margin-left: 4px;

            vertical-align: -1px;

            background: rgba(255,255,255,0.65);

            animation: cursorBlink 0.8s steps(1) infinite;
        }

        @keyframes cursorBlink {
            50% {
                opacity: 0;
            }
        }


        /* =========================================================
           DIVIDER
        ========================================================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 0 0 22px;
        }

        .divider-line {
            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.12)
                );
        }

        .divider-line:last-child {
            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.12),
                    transparent
                );
        }

        .divider-panda {
            font-size: 14px;

            opacity: 0.5;
        }


        /* =========================================================
           SOCIAL LINKS
        ========================================================= */

        .social-links {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .social-button {
            position: relative;

            display: flex;

            align-items: center;

            min-height: 62px;

            padding: 10px 15px;

            border-radius: 15px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            background:
                linear-gradient(
                    100deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.025)
                );

            overflow: hidden;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .social-button::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: -100%;

            width: 70%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.07),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }

        .social-button:hover::before {
            left: 130%;
        }

        .social-button:hover {
            transform:
                translateY(-2px)
                translateX(3px);

            border-color:
                rgba(255,255,255,0.22);

            background:
                rgba(255,255,255,0.075);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.25),
                0 0 25px rgba(255,255,255,0.035);
        }

        .social-button:active {
            transform: scale(0.985);
        }

        .social-icon {
            position: relative;

            flex: 0 0 42px;

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-right: 12px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.09);

            color: #ffffff;

            font-size: 19px;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }

        .social-button:hover .social-icon {
            transform: scale(1.08) rotate(-3deg);

            background:
                rgba(255,255,255,0.09);
        }

        .social-text {
            display: flex;

            flex-direction: column;

            min-width: 0;

            gap: 3px;
        }

        .social-text strong {
            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1.4px;
        }

        .social-text small {
            font-family: "Orbitron", sans-serif;

            font-size: 8px;

            font-weight: 500;

            letter-spacing: 1px;

            color: rgba(255,255,255,0.40);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .arrow {
            margin-left: auto;

            padding-left: 10px;

            color: rgba(255,255,255,0.30);

            font-size: 17px;

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }

        .social-button:hover .arrow {
            color: rgba(255,255,255,0.85);

            transform:
                translate(2px, -2px);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .footer {
            text-align: center;

            margin-top: 24px;

            color: rgba(255,255,255,0.28);

            font-size: 8px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .footer-panda {
            display: inline-block;

            margin-left: 5px;

            opacity: 0.7;
        }


        /* =========================================================
           FOCUS
        ========================================================= */

        .social-button:focus-visible {
            outline: 2px solid rgba(255,255,255,0.75);

            outline-offset: 3px;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 600px) {

            main {
                padding:
                    35px 14px
                    calc(35px + env(safe-area-inset-bottom));
            }

            .card {
                padding: 34px 17px 22px;

                border-radius: 23px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            .logo span {
                font-size: 49px;
            }

            .title {
                font-size: 34px;

                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 9px;

                letter-spacing: 2px;
            }

            .social-button {
                min-height: 59px;
            }

            .social-icon {
                width: 39px;
                height: 39px;

                flex-basis: 39px;

                margin-right: 10px;
            }

            .social-text strong {
                font-size: 10px;
            }

            .social-text small {
                font-size: 7px;
            }

            .arrow {
                font-size: 15px;
            }
        }


        /* =========================================================
           VERY SMALL PHONES
        ========================================================= */

        @media (max-width: 370px) {

            .card {
                padding-left: 13px;
                padding-right: 13px;
            }

            .title {
                font-size: 29px;
            }

            .social-button {
                padding-left: 11px;
                padding-right: 11px;
            }

            .social-text strong {
                font-size: 9px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>

    <script>

        /* =====================================================
           TYPING EFFECT
        ===================================================== */

        const typingElement =
            document.getElementById("typing");

        const messages = [
            "mentally afk",
            "just vibing",
            "do not disturb the panda",
            "🐼 panda mode activated"
        ];

        let messageIndex = 0;
        let characterIndex = 0;

        let deleting = false;

        function typeEffect() {

            const currentMessage =
                messages[messageIndex];

            if (!deleting) {

                typingElement.textContent =
                    currentMessage.substring(
                        0,
                        characterIndex + 1
                    );

                characterIndex++;

                if (
                    characterIndex >=
                    currentMessage.length
                ) {

                    deleting = true;

                    setTimeout(
                        typeEffect,
                        1800
                    );

                    return;
                }

                setTimeout(
                    typeEffect,
                    65
                );

            } else {

                typingElement.textContent =
                    currentMessage.substring(
                        0,
                        characterIndex - 1
                    );

                characterIndex--;

                if (characterIndex <= 0) {

                    deleting = false;

                    messageIndex =
                        (messageIndex + 1) %
                        messages.length;

                    setTimeout(
                        typeEffect,
                        450
                    );

                    return;
                }

                setTimeout(
                    typeEffect,
                    35
                );
            }
        }

        typeEffect();


        /* =====================================================
           MOUSE PARALLAX
        ===================================================== */

        const card =
            document.getElementById("profile-card");

        const background =
            document.querySelector(".background img");

        const isTouch =
            window.matchMedia(
                "(pointer: coarse)"
            ).matches;

        if (!isTouch) {

            document.addEventListener(
                "mousemove",
                (event) => {

                    const x =
                        (event.clientX /
                        window.innerWidth - 0.5);

                    const y =
                        (event.clientY /
                        window.innerHeight - 0.5);

                    card.style.transform =
                        `perspective(1000px)
                         rotateY(${x * 2}deg)
                         rotateX(${y * -2}deg)`;

                    background.style.transform =
                        `scale(1.07)
                         translate(${x * -8}px, ${y * -8}px)`;
                }
            );

            document.addEventListener(
                "mouseleave",
                () => {

                    card.style.transform =
                        "";

                    background.style.transform =
                        "scale(1.05)";
                }
            );
        }


        /* =====================================================
           TAB TITLE
        ===================================================== */

        const originalTitle =
            document.title;

        document.addEventListener(
            "visibilitychange",
            () => {

                if (document.hidden) {

                    document.title =
                        "Come back 🐼";

                } else {

                    document.title =
                        originalTitle;

                }

            }
        );


        /* =====================================================
           RANDOM PARTICLE POSITIONS
        ===================================================== */

        document
            .querySelectorAll(".particle")
            .forEach((particle) => {

                particle.style.top =
                    `${Math.random() * 100}%`;

                particle.style.opacity =
                    `${0.2 + Math.random() * 0.5}`;

            });


        /* =====================================================
           MOBILE TOUCH TILT
        ===================================================== */

        if (isTouch) {

            let touchStartX = 0;

            document.addEventListener(
                "touchstart",
                (event) => {

                    if (!event.touches.length)
                        return;

                    touchStartX =
                        event.touches[0].clientX;
                },
                { passive: true }
            );

            document.addEventListener(
                "touchmove",
                (event) => {

                    if (!event.touches.length)
                        return;

                    const currentX =
                        event.touches[0].clientX;

                    const difference =
                        currentX - touchStartX;

                    const rotation =
                        Math.max(
                            -1.5,
                            Math.min(
                                1.5,
                                difference / 100
                            )
                        );

                    card.style.transform =
                        `perspective(900px)
                         rotateY(${rotation}deg)`;
                },
                { passive: true }
            );

            document.addEventListener(
                "touchend",
                () => {

                    card.style.transform = "";

                },
                { passive: true }
            );
        }

    </script>
